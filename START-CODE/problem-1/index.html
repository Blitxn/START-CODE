<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Problem-1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind (Offline) -->
    <script src="../tailwind-browser.js"></script>
    
    
    <style>
        body {
            margin: 0;
            padding: 40px 0;
            background: #e4e6eb;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
        }
        .post {
            width: 400px;
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .post-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background: #ccc;
            border-radius: 50%;
            margin-right: 10px;
        }

        .name {
            font-weight: bold;
        }

        .time {
            font-size: 12px;
            color: gray;
        }
        .post-text {
            margin-bottom: 12px;
        }
        .post-image {
            width: 100%;
            height: 200px;
            background: #ddd;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .post-actions {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #ccc;
            padding-top: 10px;
            font-size: 14px;
        }

        .post-actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="post">
        <div class="post-header">
            <div class="avatar"></div>
            <div>
                <div class="name">John Doe</div>
                <div class="time">2 hrs ago</div>
            </div>
        </div>
        <div class="post-text">
            This is a sample Facebook post layout designed using Flexbox and Grid.
        </div>
            <div class="post-image"></div>
        <div class="post-actions">
            <button>Like</button>
            <button>Comment</button>
            <button>Share</button>
        </div> 
    
    </body>
    </div>
</html>
